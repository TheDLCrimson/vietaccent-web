  <!-- Indigo pill badge -->
  <rect x="80" y="488" width="220" height="36" rx="18" fill="rgba(99,102,241,0.15)" stroke="#6366F1" stroke-width="1" stroke-opacity="0.4"/>
  <text x="190" y="511" font-family="system-ui,sans-serif" font-weight="600" font-size="16" fill="#A5B4FC" text-anchor="middle">Open-source · Android 6.0+</text>
