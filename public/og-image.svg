  <text x="80" y="310" font-family="system-ui,sans-serif" font-weight="900" font-size="90" fill="white" letter-spacing="-3">VietAccent</text>
  <!-- Tagline -->
  <text x="80" y="380" font-family="system-ui,sans-serif" font-weight="400" font-size="36" fill="#818CF8">Learn Vietnamese. Sound like a native.</text>
